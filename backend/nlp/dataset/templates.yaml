    hi: ["क्या {loc} में {cvar} का स्तर बढ़ रहा है या घट रहा है?"]
    ne: ["के {loc}मा {cvar} बढ्दै छ कि घट्दै छ?"]
  - id: trend.date_range
    operation: TREND
