    en: ["Is there a long-term change in {cvar} in {loc}?"]
    hi: ["क्या {loc} के {cvar} में कोई दीर्घकालिक बदलाव दिख रहा है?"]
    ne: ["के {loc}को {cvar}मा दीर्घकालीन परिवर्तन देखिन्छ?"]
  - id: trend.keywords
    operation: TREND
    en: ["{cvar} trend {loc} {past}"]
    hi: ["{loc} {cvar} का रुझान {past}"]
    ne: ["{loc} {cvar} प्रवृत्ति {past}"]
  - id: trend.year_by_year
    operation: TREND
    en: ["Give me the year-by-year {cvar} pattern for {loc}."]
    hi: ["{loc} के {cvar} का साल-दर-साल पैटर्न बताइए।"]
    ne: ["{loc}को {cvar}को वर्षैपिच्छेको ढाँचा बताउनुहोस्।"]

