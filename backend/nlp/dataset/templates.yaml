# Template families for the TerraMind query dataset.
#
# A FAMILY is one meaning, phrased independently in each language. All rows
# produced by a family share its id as group_id and always land in the same
# split, so neither the same sentence frame nor a translation of it can appear
# in both train and test.
#
# Slots ({loc}, {cvar}, ...) are filled by the generator. A trailing digit
# ({loc2}) means "a second, different value of the same slot".
#   loc / town / district / river      -> LOCATION
#   var cvar vvar ndvi gvar elev temp  -> ENV_VARIABLE (different subsets)
#   dis                                -> DISASTER
#   now / past / future / range        -> TIME
#   pct / abs                          -> CHANGE
#   tdesc / hdesc / desc               -> ENV_VARIABLE (descriptors: "cold", "humid")
#   sport dish country genre skill product num -> no entity (out of domain)
#
# `split: train` pins a family to the training split. It is used for families
# added to fix a specific, observed failure (Phase 12): they must be learned
# from, so they cannot be left to land in validation or test by chance.
#
# Hindi note: variables are placed only where no word must agree with their
# gender ("{cvar} का स्तर", never "कितनी {cvar}"), because the slot can be
# filled with a masculine or a feminine noun.
#
# REVIEW STATUS: Hindi and Nepali templates are drafted and NOT yet reviewed by
# a fluent speaker.

WEATHER_QUERY:
  - id: weather.current_value
    operation: LOOKUP
    en: ["What is the {cvar} in {loc}?", "What's the {cvar} in {loc} {now}?"]
    hi: ["{loc} में {cvar} का स्तर क्या है?"]
    ne: ["{loc}मा {cvar} कति छ?"]
  - id: weather.tell_me
    operation: LOOKUP
    en: ["Tell me the {cvar} in {loc} {now}."]
    hi: ["{now} {loc} में {cvar} की स्थिति बताओ।"]
    ne: ["{now} {loc}को {cvar} बताउनुहोस्।"]
  - id: weather.how_is
    operation: LOOKUP
    en: ["How is the {cvar} in {loc} {now}?"]
    hi: ["{loc} में {now} {cvar} का क्या हाल है?"]
    ne: ["{loc}मा {now} {cvar} कस्तो छ?"]
  - id: weather.forecast_will_be
    operation: FORECAST
    en: ["What will the {cvar} be in {loc} {future}?"]
    hi: ["{future} {loc} में {cvar} का स्तर क्या रहेगा?"]
    ne: ["{future} {loc}मा {cvar} कस्तो हुन्छ?"]
  - id: weather.forecast_give
    operation: FORECAST
    en: ["Give me the {cvar} forecast for {loc} for {future}."]
    hi: ["{loc} के लिए {future} का {cvar} का पूर्वानुमान बताइए।"]
    ne: ["{loc}को {future}को {cvar}को पूर्वानुमान दिनुहोस्।"]
  - id: weather.keywords
    operation: LOOKUP
    en: ["{cvar} in {loc}", "{loc} {cvar} {now}"]
    hi: ["{loc} में {cvar}", "{loc} {cvar} {now}"]
    ne: ["{loc}मा {cvar}", "{loc} {cvar} {now}"]
  - id: weather.want_to_know
    operation: LOOKUP
    en: ["I want to know the {cvar} in {loc}."]
    hi: ["मुझे {loc} के {cvar} के बारे में जानना है।"]
    ne: ["मलाई {loc}को {cvar} थाहा पाउनु छ।"]
  - id: weather.can_you_check
    operation: LOOKUP
    en: ["Can you check the {cvar} for {loc}?"]
    hi: ["क्या आप {loc} के {cvar} की जानकारी दे सकते हैं?"]
    ne: ["के तपाईं {loc}को {cvar} हेर्न सक्नुहुन्छ?"]
  - id: weather.two_variables
    operation: LOOKUP
    en: ["What are the {cvar} and {cvar2} in {loc} {now}?"]
    hi: ["{loc} में {now} {cvar} और {cvar2} की स्थिति क्या है?"]
    ne: ["{loc}मा {now} {cvar} र {cvar2} कस्तो छ?"]
  - id: weather.followup_fragment
    operation: LOOKUP
    en: ["What about {cvar}?", "And the {cvar}?"]
    hi: ["और {cvar}?", "{cvar} के बारे में क्या?"]
    ne: ["अनि {cvar}?", "{cvar} नि?"]

  # Added in Phase 12. A follow-up that names only a time was classified as a
  # general question, because no training example looked like it.
  - id: weather.followup_time
    operation: FORECAST
    split: train
    en: ["How will it be {future}?", "What about {future}?"]
    hi: ["{future} कैसा रहेगा?", "और {future}?"]
    ne: ["{future} कस्तो हुन्छ?", "{future} नि?"]
  # Added in Phase 12. "How cold is it?" names no variable; "cold" implies one.
  - id: weather.descriptor_temperature
    operation: LOOKUP
    split: train
    en: ["How {tdesc} is it in {loc} {now}?", "Is it {tdesc} in {loc}?", "How {tdesc} is it out there?"]
    hi: ["{loc} में {now} कितनी {tdesc} है?", "क्या {loc} में {tdesc} है?", "कितनी {tdesc} है?"]
    ne: ["{loc}मा {now} कत्तिको {tdesc} छ?", "के {loc}मा {tdesc} छ?", "कत्तिको {tdesc} छ?"]

