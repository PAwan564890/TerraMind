    ne: ["{loc} र {loc2}को {cvar} तुलना गर्नुहोस्।"]
  - id: compare.which_higher
    operation: COMPARE
    en: ["Which has higher {cvar}, {loc} or {loc2}?"]
    hi: ["{loc} और {loc2} में से किसका {cvar} का स्तर ज़्यादा है?"]
