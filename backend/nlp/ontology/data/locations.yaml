# Gazetteer for Sikkim: location ID -> name, type, parent, surface forms.
#
# District names follow the reorganisation of 21 December 2021 (North -> Mangan,
# East -> Gangtok, South -> Namchi, West -> Gyalshing; Pakyong and Soreng new).
# Source: https://en.wikipedia.org/wiki/List_of_districts_of_Sikkim
# (accessed 2026-10-05). The old names stay as aliases because people use them.
#
# A bare town name ("Gangtok") resolves to the TOWN. The district needs the
# word "district" or its old name ("East Sikkim").
#
# REVIEW STATUS: Devanagari spellings are drafted and NOT yet reviewed by a
# fluent speaker. Town-to-district assignments should be re-checked against an
# official source when the data layer is built.

loc:sikkim:
  name: Sikkim
  type: STATE
  parent: null
  aliases:
    en: [Sikkim]
    hi: [सिक्किम]
    ne: [सिक्किम]

