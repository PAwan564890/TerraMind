# Third evaluation set: real-user-STYLE queries.
#
# WHAT IT IS. Queries written to look like what people actually type: typos,
# no punctuation, keywords only, loanwords, chatty openings, places outside
# the gazetteer, words that imply a variable without naming it.
#
# WHAT IT IS NOT. It is NOT real user data. Every query was written by the
# same AI assistant that wrote the system. It is a stand-in until real
# queries are collected; docs/EVALUATION.md describes how to collect them.
#
# HOW IT DIFFERS FROM gold.yaml AND gold_v2.yaml. Those two sets are clean,
# complete, well-punctuated questions, each written once and rendered in all
# three languages. A third set of that shape would measure the same thing
# again. Here each language is written on its own terms, the text is messy on
# purpose, and every item names the phenomenon it tests.
#
# RULES. Never generated, never trained on, never used to choose a threshold
# or a fix. It was written before the final models were trained and before
# their errors were seen.
#
# STATUS: its errors were read once, to write docs/EVALUATION.md. Nothing was
# changed in response. Any fix made from here on that is informed by those
# errors turns this into a development set too.
#
# `scored: false` marks input the system does not claim to support
# (romanised text, two questions in one, genuinely ambiguous requests). Those
# are run and their behaviour is reported, but they do not count for or
# against the score.
#
# REVIEW STATUS: PENDING. Hindi and Nepali text has NOT been reviewed by a
# fluent speaker. Colloquial spellings here are the author's best attempt.
# SIZE: 58 queries (20 English, 19 Hindi, 19 Nepali), 54 of them scored.

# ----------------------------------------------------------------- English
- id: real.en.typo_slang
  language: en
  phenomenon: typo
  text: "whats the temprature in gangtok rn"
  expected: {status: ok, intent: WEATHER_QUERY, operation: LOOKUP, locations: [loc:gangtok], variables: [TEMPERATURE], time_period: {type: current}}

