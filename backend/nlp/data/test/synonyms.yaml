# Evaluation set for the embedding fallback in entity normalisation.
#
# `positives` are words that mean a variable or disaster but are NOT listed as
# aliases in the ontology, so dictionary lookup cannot resolve them.
# `negatives` are words that must stay unresolved.
#
# Hand-written, small, and by the same author as the ontology: treat scores on
# it as indicative only. Hindi and Nepali entries are NOT yet reviewed by a
# fluent speaker.

