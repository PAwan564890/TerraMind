      expect: {intent: OUT_OF_DOMAIN, locations: [], variables: [], context_used: []}
    - text: "और तापमान?"
      parse: {language: hi, intent: WEATHER_QUERY, variables: [TEMPERATURE], fragment: true}
      expect: {intent: WEATHER_QUERY, locations: [loc:mangan], variables: [TEMPERATURE], context_used: [intent, locations]}

- id: disaster_followup_changes_the_intent
  note: The classifier calls the fragment a weather query; the disaster overrides that.
  turns:
    - text: "What is the temperature in Gangtok?"
      parse: {language: en, intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [TEMPERATURE]}
      expect: {intent: WEATHER_QUERY, context_used: []}
    - text: "And landslides?"
      parse: {language: en, intent: WEATHER_QUERY, disasters: [LANDSLIDE], fragment: true}
      expect: {intent: DISASTER_RISK, locations: [loc:gangtok], variables: [], disasters: [LANDSLIDE], context_used: [locations]}

