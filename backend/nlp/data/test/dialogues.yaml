    - text: "और पिछले पांच सालों में?"
      parse: {language: hi, intent: CLIMATE_TREND, time_period: {type: relative_past, value: 5, unit: year}, fragment: true}
      expect:
        intent: VEGETATION_ANALYSIS
        locations: [loc:namchi_district]
        variables: [NDVI]
        time_period: {type: relative_past, value: 5, unit: year}
        context_used: [intent, locations, variables]

