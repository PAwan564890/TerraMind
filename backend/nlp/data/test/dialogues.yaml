    - text: "Compare rainfall in North Sikkim and South Sikkim."
      parse: {language: en, intent: COMPARISON, locations: [loc:mangan_district, loc:namchi_district], variables: [PRECIPITATION]}
      expect: {intent: COMPARISON, locations: [loc:mangan_district, loc:namchi_district], context_used: []}
    - text: "तापक्रम नि?"
      parse: {language: ne, intent: WEATHER_QUERY, variables: [TEMPERATURE], fragment: true}
      expect: {intent: COMPARISON, locations: [loc:mangan_district, loc:namchi_district], variables: [TEMPERATURE], context_used: [intent, locations]}

