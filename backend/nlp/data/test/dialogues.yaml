# Multi-turn test conversations.
#
# Each turn has:
#   text    what the user typed
#   parse   what a PERFECT parser would extract from this turn alone
#           (language, intent, slots; `fragment: true` for entity-only turns).
#           For a fragment, `intent` is what the classifier would say with no
#           context, which is often wrong on purpose.
#   expect  the result after context resolution
#
# In Phase 9 the context rules are tested alone, fed with `parse`. In the
# end-to-end evaluation the same file is run through the real models, using
# only `text` and `expect`.
#
# Hand-written. 18 dialogues, 43 turns; the design target was 40 dialogues.
# REVIEW STATUS: Hindi and Nepali text is NOT yet reviewed by a fluent speaker.

- id: brief_cross_language
  note: The example from the project brief. Language changes every turn.
  turns:
    - text: "What is the temperature in Gangtok?"
      parse: {language: en, intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [TEMPERATURE]}
      expect: {intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [TEMPERATURE], context_used: []}
    - text: "और बारिश?"
      parse: {language: hi, intent: WEATHER_QUERY, variables: [PRECIPITATION], fragment: true}
      expect: {intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [PRECIPITATION], context_used: [intent, locations]}
    - text: "भोलिको अवस्था कस्तो हुन्छ?"
      parse: {language: ne, intent: WEATHER_QUERY, time_period: {type: relative_future, value: 1, unit: day}}
      expect:
        intent: WEATHER_QUERY
        locations: [loc:gangtok]
        variables: [PRECIPITATION]
        time_period: {type: relative_future, value: 1, unit: day}
        context_used: [locations, variables]

