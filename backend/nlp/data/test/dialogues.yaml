      parse: {language: en, intent: CLIMATE_TREND, locations: [loc:gangtok], variables: [PRECIPITATION], time_period: {type: relative_past, value: 5, unit: year}}
      expect: {intent: CLIMATE_TREND, locations: [loc:gangtok], variables: [PRECIPITATION], context_used: []}
    - text: "What about Namchi?"
      parse: {language: en, intent: GEOLOCATION_QUERY, locations: [loc:namchi], fragment: true}
      expect:
        intent: CLIMATE_TREND
        locations: [loc:namchi]
        variables: [PRECIPITATION]
        time_period: {type: relative_past, value: 5, unit: year}
        context_used: [intent, variables, time_period]

- id: answer_to_a_clarification
  note: The first turn lacks a location; the user then supplies only the place.
  turns:
    - text: "What is the temperature?"
      parse: {language: en, intent: WEATHER_QUERY, variables: [TEMPERATURE]}
      expect: {intent: WEATHER_QUERY, locations: [], variables: [TEMPERATURE], context_used: []}
    - text: "Gangtok"
      parse: {language: en, intent: GEOLOCATION_QUERY, locations: [loc:gangtok], fragment: true}
      expect: {intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [TEMPERATURE], context_used: [intent, variables]}

