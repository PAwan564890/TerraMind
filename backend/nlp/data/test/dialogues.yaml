- id: scenario_inherits_location_but_is_not_stored
  note: >
    A hypothetical borrows the place under discussion, but does not become the
    topic: the next follow-up returns to the weather question.
  turns:
    - text: "What is the temperature in Gangtok?"
      parse: {language: en, intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [TEMPERATURE]}
      expect: {intent: WEATHER_QUERY, locations: [loc:gangtok], context_used: []}
    - text: "What happens if rainfall increases by 20%?"
      parse:
        language: en
        intent: SCENARIO_ANALYSIS
        variables: [PRECIPITATION]
        scenario: {variable: PRECIPITATION, change: 20, unit: percent, direction: increase}
      expect: {intent: SCENARIO_ANALYSIS, locations: [loc:gangtok], variables: [PRECIPITATION], context_used: [locations]}
    - text: "What about humidity?"
      parse: {language: en, intent: WEATHER_QUERY, variables: [HUMIDITY], fragment: true}
      expect: {intent: WEATHER_QUERY, locations: [loc:gangtok], variables: [HUMIDITY], context_used: [intent, locations]}

